server:
  port: 8084

spring:
  application:
    name: prescription-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://PediaLink:PediaLink@pedialink.0d8a5qd.mongodb.net/pedialink?retryWrites=true&w=majority}

app:
  jwt:
    secret: PediaLinkSuperSecretKeyForJwtToken2024MustBeAtLeast256BitsLong!!
    expiration-ms: 86400000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    tn.pedialink.prescription: DEBUG

# Google Cloud APIs Configuration
google:
  vision:
    api:
      key: ${GOOGLE_VISION_API_KEY:AIzaSyDcgWtfgr4F2ZLSUAiKtyEaeJ9CDbvmxfs}
      # To get your API key:
      # 1. Go to https://console.cloud.google.com/
      # 2. Enable Cloud Vision API
      # 3. Create credentials (API Key)
      # 4. Set the environment variable GOOGLE_VISION_API_KEY or replace the value above
  
  translate:
    api:
      key: ${GOOGLE_TRANSLATE_API_KEY:YOUR_GOOGLE_TRANSLATE_API_KEY_HERE}
      # To get your API key:
      # 1. Go to https://console.cloud.google.com/
      # 2. Enable Cloud Translation API
      # 3. Create credentials (API Key)
      # 4. Set the environment variable GOOGLE_TRANSLATE_API_KEY or replace the value above

# Alternative: DeepL API (more accurate translations)
deepl:
  api:
    key: ${DEEPL_API_KEY:YOUR_DEEPL_API_KEY_HERE}
    # To get your API key:
    # 1. Go to https://www.deepl.com/pro-api
    # 2. Sign up for DeepL API
    # 3. Get your authentication key
    # 4. Set the environment variable DEEPL_API_KEY or replace the value above

# File Upload Configuration
spring.servlet.multipart:
  enabled: true
  max-file-size: 5MB
  max-request-size: 5MB
